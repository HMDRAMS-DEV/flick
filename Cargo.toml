[package]
name = "flick"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[profile.release]
lto = true
codegen-units = 1
strip = true
